<mat-card appearance="outlined">
  <mat-card-header class="card-title">
    <mat-card-title> {{ vehicle?.make }} {{ vehicle?.model }} </mat-card-title>
    <span class="price"
      >{{ vehicle?.price | currency: 'GBP':'symbol':'1.0-0' }}</span
    >
  </mat-card-header>
  <mat-card-content class="card-content">
    <mat-chip-set>
      <mat-chip>{{ vehicle?.colour }}</mat-chip>
      <mat-chip>{{ vehicle?.year }}</mat-chip>
      <mat-chip>{{ vehicle?.mileage | number }} miles</mat-chip>
    </mat-chip-set>
  </mat-card-content>
  <mat-card-footer class="card-footer">
    <button [routerLink]="['/vehicles', vehicle?.id]" matButton="filled">
      View Details
    </button>
  </mat-card-footer>
</mat-card>
